name: .NET

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "logEngine/**"
      - "*.slnx"
      - "*.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "logEngine/**"
      - "*.slnx"
      - "*.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Schiza.slnx

      - name: Check formatting
        run: dotnet format Schiza.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Schiza.slnx --configuration Release --no-restore
