name: .NET

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "application/**"
      - "domain/**"
      - "infrastructure/**"
      - "logEngine/**"
      - "shared/**"
      - "tools/**"
      - "*.slnx"
      - "*.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main, Bartlomiej-cleanup]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dotnet:
              - "api/**"
              - "application/**"
              - "domain/**"
              - "infrastructure/**"
              - "logEngine/**"
              - "shared/**"
              - "tools/**"
              - "*.slnx"
              - "*.props"
              - "global.json"
              - "nuget.config"
              - ".editorconfig"
              - ".github/workflows/dotnet.yml"

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Schiza.slnx

      - name: Check formatting
        run: dotnet format Schiza.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Schiza.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Schiza.slnx --configuration Release --no-build
