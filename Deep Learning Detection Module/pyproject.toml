
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pandas",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "joblib"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
